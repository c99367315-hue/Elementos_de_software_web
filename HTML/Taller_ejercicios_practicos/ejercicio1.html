<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 1 - Taller de Ejercicios Prácticos</title>
    </head>
    <body>
        <h1>Comida de cada dia de la semana</h1>
        <table border="1">
            <tr>
                <th>Día de la semana</th>
                <th>Comida</th>
            </tr>
            <tr>
                <th>Lunes</th>
                <td>Arroz con pollo</td>
            </tr>
            <tr>
                <th>Martes</th>
                <td>Frijoles con carne molida</td>
            </tr>
            <tr>
                <th>Miércoles</th>
                <td>Carne asada con papas</td>
            </tr>
            <tr>
                <th>Jueves</th>
                <td>Ensalada de atún con arroz</td>
            </tr>
            <tr>
                <th>Viernes</th>
                <td>Pasta con salsa de tomate</td>
            </tr>
            <tr>
                <th>Sábado</th>
                <td>Pizza casera</td>
            </tr>
            <tr>
                <th>Domingo</th>
                <td>Asado con ensalada</td>
            </tr>        
        </table>
           
    </body>

</html>
